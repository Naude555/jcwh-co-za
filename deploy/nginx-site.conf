# Static server for the built site.
#
# Mounted by the Dockerfile at /etc/nginx/conf.d/default.conf. Redirects for the old
# site's URLs are generated per site into deploy/nginx-redirects.conf and included
# below — nginx does not understand Netlify's _redirects file.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro fingerprints asset filenames, so they can be cached indefinitely.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Old URLs 301 to their new paths.
    include /etc/nginx/redirects.conf;

    # Clean URLs: /contact serves /contact/index.html.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
